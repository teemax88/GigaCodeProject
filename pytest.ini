[pytest]
addopts =
    -v
    --alluredir={env:ALLURE_DIR:reports/allure}
    --clean-alluredir
    --strict-markers
    --tb=short

markers =
    smoke: smoke-тесты
    regression: регрессионные тесты
    api: API-тесты
    ui: UI-тесты
    slow: медленные тесты

testpaths =
    tests
    api
    ui
